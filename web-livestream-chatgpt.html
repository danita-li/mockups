</style></head><body><header class="topbar"><button class="mobile-menu" id="mobileMenu" aria-label="打开导航">☰</button><span class="appgrid">⠿</span><img class="brand-mark" src="assets/podbean-icon.png" alt="Podbean logo"><div class="brand-name">Podbean</div><div class="top-actions"><span class="top-icon">♧</span><span class="top-icon">?</span><span class="top-divider"></span><div class="profile"><img class="avatar-photo" src="assets/danita-avatar.svg" alt="Danita profile photo"><span class="profile-name">Danita</span><span>⌄</span></div></div></header><div class="shell"><aside class="sidebar" id="sidebar"></aside><main class="main"><div class="content" id="app"></div></main></div><div id="overlay"></div><script>

function stats(items,activeId=null){let ids=['listeners','hours','engagement','podpoints'];return `<div class="${activeId?'stats-row':'card stats-row'}" ${activeId?'role="tablist" aria-label="Statistics metric"':''}>${items.map((x,i)=>{let cls=activeId?'stat metric-tab '+(activeId===ids[i]?'active':''):'stat';let tag=activeId?'button':'div';return `<${tag} class="${cls}" ${activeId?`data-page="${ids[i]}" role="tab" aria-selected="${activeId===ids[i]}" tabindex="${activeId===ids[i]?0:-1}"`:''}><div class="stat-label">${x[0]} <span title="${x[0]}">ⓘ</span></div><div class="stat-value">${x[1]}</div><div class="stat-sub">${x[2]||''}</div></${tag}>`}).join('')}</div>`}
function chart(id){let names={listeners:'Listeners',hours:'Live Hours',engagement:'Engagement',podpoints:'PodPoints'};let seed={listeners:1,hours:3,engagement:5,podpoints:7}[id]||1;let vals=Array.from({length:31},(_,i)=>{let wave=Math.sin((i+seed)*.57)*48+Math.sin((i+seed)*.19)*52+Math.sin((i+seed)*1.31)*15;let trend=(i/30)*26;return Math.max(18,Math.min(205,104+wave+trend))});let path=vals.map((v,i)=>`${i?'L':'M'} ${(i*1000/(vals.length-1)).toFixed(1)} ${235-v}`).join(' ');let area=path+` L 100 235 L 0 235 Z`;return `<div class="chart-wrap"><svg viewBox="0 0 1000 280" preserveAspectRatio="none" role="img" aria-label="${names[id]||'Statistics'} chart"><defs><linearGradient id="area" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f5c94f" stop-opacity=".12"/><stop offset="1" stop-color="#f5c94f" stop-opacity="0"/></linearGradient></defs>${[55,110,165,220].map(y=>`<line class="gridline" x1="0" x2="1000" y1="${y}" y2="${y}"/>`).join('')}<path class="area" d="${area}" transform="translate(0,5)"/><path class="line" d="${path}" transform="translate(0,5)"/>${['Oct 1','Oct 5','Oct 9','Oct 13','Oct 17','Oct 21','Oct 25','Oct 29','Oct 31'].map((d,i)=>`<text class="axis" x="${i*125}" y="270">${d}</text>`).join('')}</svg></div>`}

function table(headers,rows,opts={}){return `<div class="card"><div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${opts.pagination===false?'':pagination(opts.count||rows.length)}</div>`}

function invite(){return head('Invite Co-hosts','Step 2 of 2 · Invite listeners and co-hosts')+`<div class="card" style="max-width:850px;padding:24px"><div class="field"><label>Invite link</label><div style="display:flex;gap:9px"><input class="input" style="flex:1" readonly value="https://podbean.com/live/your-show"><button class="btn" id="copyInvite">Copy</button></div></div><div class="field"><label>Invite by email</label><div style="display:flex;gap:9px"><input class="input" style="flex:1" placeholder="name@example.com or @username"><button class="btn" id="addInvite">Add</button></div><div class="muted" style="font-size:12px;margin-top:8px">Your co-host will receive an invitation with a link to join the studio.</div></div><div class="subheading">Co-hosts <span class="muted" style="font-weight:400">(3)</span></div>${table(['Co-host','Invitation status','Role',''],[['<div class="member"><span class="avatar a3">SR</span>Sofia Rivera</div>','<span class="badge gold">Pending</span>','Co-host','⋯'],['<div class="member"><span class="avatar a2">DB</span>Daniel Brooks</div>','<span class="badge green">Accepted</span>','Co-host','⋯'],['<div class="member"><span class="avatar a4">EP</span>Ethan Park</div>','<span class="badge gold">Pending</span>','Co-host','⋯']],{pagination:false})}<div style="display:flex;justify-content:space-between;margin-top:19px"><button class="btn" data-page="new-show">← &nbsp;Back to details</button><button class="btn primary" id="scheduleShow">Create live show</button></div></div>`}
function statPage(id){let title=id==='listeners'?'Listeners':id==='hours'?'Live Hours':id==='engagement'?'Engagement':'PodPoints';let items=id==='listeners'?[['Total listeners','12,560','↑ 12.8% vs previous period'],['Unique listeners','8,420','↑ 8.2% vs previous period'],['Peak concurrent','342','↑ 6.4% vs previous period'],['Avg. listening time','24m 18s','↑ 3.1% vs previous period']]:id==='hours'?[['Total live hours','186.5','↑ 18.2% vs previous period'],['Shows hosted','42','↑ 12.0% vs previous period'],['Avg. show length','1h 14m','↑ 4.5% vs previous period'],['Longest show','3h 22m','Sep 28, 2026']]:id==='engagement'?[['Total interactions','8,492','↑ 21.6% vs previous period'],['Comments','4,210','↑ 15.1% vs previous period'],['Gifts received','1,847','↑ 32.4% vs previous period'],['New followers','642','↑ 9.8% vs previous period']]:[['PodPoints earned','248,650','↑ 28.4% vs previous period'],['From gifts','198,200','↑ 31.7% vs previous period'],['Bonus points','32,450','↑ 16.2% vs previous period'],['Redeemed','18,000','This period']];let val=id==='hours'?'186.5 hrs':id==='engagement'?'8,492 interactions':id==='podpoints'?'248,650 points':'12,560 listeners';let shows=table(['Live show','Date','Listeners','Live hours','Interactions','PodPoints'],[['Sunday Jazz & Stories','Oct 18, 2026','342','1h 12m','1,024','12,460'],['Behind the Mic','Oct 16, 2026','298','56m','812','9,840'],['Studio Sessions #08','Oct 12, 2026','276','1h 04m','786','8,920'],['The Sunday Edit','Oct 10, 2026','245','48m','641','7,320'],['Late Night Notes','Oct 08, 2026','219','1h 20m','592','6,780']],{pagination:false});let fans=table(['Fan','PodPoints','Live shows joined'],people.slice(0,5).map((p,i)=>[member(i),['12,450','9,800','8,250','6,100','5,820'][i],['38','31','28','24','21'][i]]),{pagination:false});let gifts=table(['Gift','Received','PodPoints'],[['👏 Clap','428','42,800'],['🌟 Superstar','1,204','36,120'],['🎙 Gold Mic','2,650','26,500'],['💡 Spotlight','84','16,800'],['🌹 Rose','3,410','10,230']],{pagination:false});return head('Statistics','Understand your audience and see what resonates.','<button class="btn">⇩ &nbsp;Export</button>')+`<section class="card stats-overview-card">${stats(items,id)}${chart(id)}</section>`+`<div class="subheading">Top Live Shows</div>${shows}<div class="post-layout" style="grid-template-columns:1fr 1fr;margin-top:23px"><div><div class="subheading">Top Fans</div>${fans}</div><div><div class="subheading">Top Received Gifts</div>${gifts}</div></div>`}
function earnings(empty=false){let rows=people.slice(0,7).map((p,i)=>[`<span class="title-cell">Live Show Title</span>`,`2025-03-${String(13-i).padStart(2,'0')} 16:30:00`,`<span class="gift">◉</span> 1,980`,String(8-i%3),String(12-i%4),`<div class="member"><span class="avatar a2">D</span>Danielle</div>`,`<button class="btn small" data-page="gift-details">View Details</button>`]);if(empty)rows=[];let content=table(['Live Shows','Time','PodPoints','Gift Users','Gift Count','Top Gifter','Action'],rows,{count:empty?0:17});content=content.replace(/Showing[^<]+/,empty?'Showing 0 entries':'Showing 1 to 20 of 150 entries');if(empty)content=content.replace('</table>','</table><div class="empty" style="min-height:260px"><div class="empty-icon">▤</div><p>You have not received any PodPoints yet.</p><button class="btn green" id="learnPayout">Learn more</button></div>');return head('Earnings','View gifts and earnings from your live shows.','<button class="btn small" data-page="earnings-empty">Preview empty state</button><button class="btn">⇩ &nbsp;Export</button>')+toolbar('<select class="select"><option>Mar 1, 2025 – Mar 13, 2025</option><option>Last 30 days</option><option>Last 90 days</option></select>','<input class="input search" placeholder="⌕  Search live shows">')+content}
function giftDetails(){let rows=[['19,800','10'],['16,500','8'],['6,980','3'],['1,980','1'],['1,980','1'],['1,980','1'],['1,980','1'],['1,980','1']].map(([points,count])=>[`<div class="member"><img class="avatar-photo" src="assets/danita-avatar.svg" alt=""><span class="member-name">Danielle</span></div>`,`<span class="gift">◉</span> ${points}`,count]);let content=table(['Gifters','PodPoints','Gift Count'],rows,{count:17});content=content.replace(/Showing[^<]+/,'Showing 1 to 20 of 150 entries');return `<div class="page-head gift-detail-head"><div style="display:flex;align-items:center;gap:7px"><button class="btn back-button" data-page="earnings" aria-label="Back to earnings">‹</button><h1>Gift Details</h1></div></div>`+content}
function payouts(empty=false){let header=head('Payouts','Review your PodPoints payout history.',empty?'<button class="btn small" data-page="payouts">View payout history</button>':'<button class="btn primary" id="addPayPal">Add PayPal Payout Account</button>');if(empty)return header+`<div class="payout-summary"><span>Total: <strong>0</strong></span><span>Balance: <strong>0</strong></span></div>`+`<div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>PodPoints</th><th>Amount</th><th>Status</th><th>Time</th></tr></thead></table></div><div class="empty"><div class="empty-icon">▤</div><p>You haven't received any PodPoints eligible for payout yet.</p><button class="btn green" id="learnPayout">Learn more</button></div></div>`;let rows=Array.from({length:7},(_,i)=>[`<span class="gift">◉</span> 2,980`,'$29.80',`<span class="badge ${i===0?'gold':'green'}">${i===0?'Pending':'Paid'}</span>`,`2025-03-${String(13-i).padStart(2,'0')} 16:30:00`]);let content=table(['PodPoints','Amount','Status','Time'],rows,{count:17});content=content.replace(/Showing[^<]+/,'Showing 1 to 20 of 150 entries');return header+`<div class="payout-summary"><span>Total: <strong>$1,250.50</strong></span><span>Balance: <strong>$325.00</strong></span><span class="muted">PayPal Payout Account: paypal@gmail.com</span><button class="btn small" id="editPay">✎</button></div>`+content}
function communityEmpty(create=false){return head(create?'Create Post':'Community',create?'Share an update with your Fan Club members.':'Connect with your Fan Club members.',create?'<button class="btn" data-page="community">← Back</button>':'<button class="btn">Set Membership Fee</button>')+(create?`<div class="card" style="max-width:850px;padding:21px"><div class="composer"><span class="avatar">DA</span><div style="width:100%"><div class="field"><label>Title</label><input class="input" style="width:100%" placeholder="Write a title"></div><div class="field"><label>Description</label><textarea id="postText" placeholder="Write a post for your fan club..."></textarea></div><div class="field"><label>Upload image</label><button class="btn" id="addPhoto">＋ &nbsp;Choose image</button></div></div></div><div class="composer-footer"><span></span><button class="btn green" id="publishPost">Create Post</button></div></div>`:`<div class="card empty"><div class="empty-icon">▤</div><h2>Your community is waiting</h2><p>Compose memorable announcements, share unforgettable moments, and engage like never before. Get ready to connect and leave your fans craving more!</p><button class="btn green" data-page="create-empty">Create Post</button></div>`)}
function postFeed(){return `<article class="card feed-card"><div class="feed-head"><span class="avatar">DA</span><div><div style="font-weight:600">Danita</div><div class="feed-meta">Oct 19, 2026 · 2:34 PM</div></div><span style="margin-left:auto">⋯</span></div><div class="feed-body">A little peek behind the mic from yesterday’s session 🎙️ The best conversations always happen when we least expect them. Thanks for being part of this community — I’ve got something special planned for next week!</div><div class="feed-image"><span>Sunday afternoon in the studio</span></div><div class="feed-actions"><span>♡ &nbsp;28 likes</span><span>▤ &nbsp;6 comments</span><span style="margin-left:auto">↗ &nbsp;Share</span></div></article><article class="card feed-card"><div class="feed-head"><span class="avatar">DA</span><div><div style="font-weight:600">Danita</div><div class="feed-meta">Oct 16, 2026 · 11:08 AM</div></div></div><div class="feed-body">New episode is up! We talked about making space for creativity when life gets busy. Listen now and tell me what you think. 💚</div><div class="feed-actions"><span>♡ &nbsp;19 likes</span><span>▤ &nbsp;3 comments</span><span style="margin-left:auto">↗ &nbsp;Share</span></div></article>`}
function community(){return head('Community','Share updates and special moments with your fan club.','<button class="btn primary" data-page="create-empty">＋ &nbsp;Create post</button>')+`<div class="post-layout"><div>${postFeed()}</div><aside class="card" style="padding:19px"><div style="font-weight:600;margin-bottom:13px">Your community</div>${[['Members','1,284'],['Posts this month','12'],['New members','86']].map(x=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eff0f0;font-size:12px;color:#72797a"><span>${x[0]}</span><strong style="color:#252a2b">${x[1]}</strong></div>`).join('')}<button class="btn small" style="width:100%;margin-top:14px" data-page="members">View members →</button></aside></div>`}
function members(){let list=table(['Member','Total PodPoints','Membership'],[['Patricia','♥ 9,974','<span class="badge blue">Super Fan</span>'],['Paul','♥ 7,061','<span class="badge blue">Super Fan</span>'],['Patricia','♥ 5,960','<span class="badge blue">Super Fan</span>'],['Danita','♥ 4,692','<span class="badge blue">Super Fan</span>'],['fongiz','♥ 565','<span class="badge blue">Super Fan</span>'],['test','♥ 233','<span class="badge blue">Super Fan</span>'],['Paul','♥ 120','<span class="badge blue">Super Fan</span>'],['test','♥ 35','<span class="badge blue">Super Fan</span>'],['gafgaf','♥ 20','<span class="badge blue">Super Fan</span>']],{count:9}).replace('Showing 1–9 of 82 results','Showing 1 to 9 of 14 entries');return head('Fan Club Members','The listeners who are part of your community.')+`<div class="card" style="width:100%"><div style="padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px"><strong>Fan Club</strong><span class="badge blue">14 Members</span><button class="btn small" style="margin-left:auto">⋯</button></div>${list}</div>`}
function render(){nav();let p=current;let output=p==='shows'?shows():p==='new-show'?showForm():p==='invite'?invite():['listeners','hours','engagement','podpoints'].includes(p)?statPage(p):p==='earnings'?earnings():p==='earnings-empty'?earnings(true):p==='gift-details'?giftDetails():p==='payouts'?payouts(false):p==='payouts-empty'?payouts(true):p==='community-empty'?communityEmpty(false):p==='create-empty'?communityEmpty(true):p==='community'?community():members();document.getElementById('app').innerHTML=output;document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));document.querySelectorAll('.days').forEach(s=>s.addEventListener('change',()=>{filterDays=s.value}));document.querySelectorAll('.compare').forEach(b=>b.addEventListener('click',()=>toast('Comparison view enabled')));document.querySelectorAll('.search').forEach(inp=>inp.addEventListener('input',()=>{let q=inp.value.toLowerCase();document.querySelectorAll('.table tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q)?'':'none')}));document.querySelectorAll('.page-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.page-btn').forEach(x=>x.classList.remove('current'));b.classList.add('current')}));wire();window.scrollTo(0,0)}
function go(id){current=id;location.hash=id;document.getElementById('sidebar').classList.remove('open');render()}
function toast(message){let el=document.createElement('div');el.className='toast';el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),2600)}
function modal(title,description,body,action='Save changes'){document.getElementById('overlay').innerHTML=`<div class="modal-backdrop"><div class="modal"><h2>${title}</h2><p class="hint">${description}</p>${body}<div class="modal-footer"><button class="btn" id="closeModal">Cancel</button><button class="btn primary" id="modalSubmit">${action}</button></div></div></div>`;document.getElementById('closeModal').onclick=()=>document.getElementById('overlay').innerHTML='';document.querySelector('.modal-backdrop').addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))document.getElementById('overlay').innerHTML=''});document.getElementById('modalSubmit').onclick=()=>{document.getElementById('overlay').innerHTML='';toast('Changes saved')}}
function wire(){document.querySelectorAll('.nav-head[data-group]').forEach(b=>b.addEventListener('click',()=>{let sub=b.nextElementSibling;sub.hidden=!sub.hidden;b.querySelector('.chevron').textContent=sub.hidden?'⌄':'⌃'}));const byId=(id,fn)=>{let x=document.getElementById(id);if(x)x.addEventListener('click',fn)};byId('mobileMenu',()=>document.getElementById('sidebar').classList.toggle('open'));byId('continueShow',()=>go('invite'));byId('copyInvite',()=>toast('Invite link copied'));byId('scheduleShow',()=>{toast('Your live show has been created');go('shows')});byId('addInvite',()=>toast('Co-host added to invitations'));byId('sendInvites',()=>toast('Invitations sent'));byId('addPayPal',()=>modal('Add PayPal payout account','Connect the PayPal account where you receive payouts.',`<div class="field"><label>PayPal email</label><input class="input" style="width:100%" placeholder="name@example.com"></div>`,'Add account'));byId('requestPayout',()=>modal('Request payout','Your payout will be sent to your saved PayPal account.',`<div class="detail-banner"><div><div style="font-weight:600">Available balance</div><div class="muted">PayPal · elina.creator@example.com</div></div><strong style="margin-left:auto;font-size:20px">$1,245.80</strong></div><div class="field"><label>Payout amount</label><input class="input" style="width:100%" value="$1,245.80"></div>`,'Request payout'));byId('editPay',()=>modal('Payout account','Update where you receive your earnings.',`<div class="field"><label>Payment method</label><select class="select" style="width:100%"><option>PayPal</option><option>Bank transfer</option></select></div><div class="field"><label>Email address</label><input class="input" style="width:100%" value="elina.creator@example.com"></div>`));byId('learnPayout',()=>modal('About payouts','Your earnings are paid out once you reach the minimum balance.',`<p style="font-size:13px;color:#555">Payouts are processed twice each month. You can request a payout when your available balance reaches $50. Update your payout method at any time in Payments settings.</p>`,'Got it'));byId('publishPost',()=>{let t=document.getElementById('postText');if(t.value.trim()){toast('Your post has been published');t.value=''}else toast('Write a message before publishing')});byId('addPhoto',()=>toast('Photo attachment selected'));byId('addAudio',()=>toast('Audio attachment selected'));byId('exportGifts',()=>toast('Gift details export is ready'))}
window.addEventListener('hashchange',()=>{current=location.hash.slice(1)||'shows';render()});render();
</script></body></html>
