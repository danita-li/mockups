<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f8d874"/>
      <stop offset="0.5" stop-color="#edb93c"/>
      <stop offset="1" stop-color="#c88f12"/>
    </linearGradient>
    <radialGradient id="sun" cx="30%" cy="16%" r="80%">
      <stop offset="0" stop-color="#fff3c2" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bok" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6cf" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffdf8a" stop-opacity="0"/>
    </radialGradient>
    <g id="grain">
      <ellipse cx="0" cy="0" rx="4.6" ry="9"/>
      <path d="M0 -8 C 1 -4 1 4 0 8" fill="none" stroke="#c9932b" stroke-opacity="0.35" stroke-width="0.9"/>
    </g>
    <g id="stalk">
      <path d="M0 290 C 6 200 2 110 0 -10" fill="none" stroke="#b37f24" stroke-width="2.6" stroke-linecap="round"/>
      <g fill="#f3d07a">
        <use xlink:href="#grain" transform="translate(-8 -2) rotate(-28)"/>
        <use xlink:href="#grain" transform="translate(8 4) rotate(26)"/>
        <use xlink:href="#grain" transform="translate(-8 22) rotate(-30)"/>
        <use xlink:href="#grain" transform="translate(8 28) rotate(24)"/>
        <use xlink:href="#grain" transform="translate(-8 46) rotate(-26)"/>
        <use xlink:href="#grain" transform="translate(8 52) rotate(28)"/>
        <use xlink:href="#grain" transform="translate(-7 70) rotate(-24)"/>
        <use xlink:href="#grain" transform="translate(7 76) rotate(26)"/>
      </g>
      <g fill="#e5b64c">
        <use xlink:href="#grain" transform="translate(0 -14) rotate(-6) scale(0.9)"/>
        <use xlink:href="#grain" transform="translate(-6 5) rotate(-34) scale(0.85)"/>
        <use xlink:href="#grain" transform="translate(6 12) rotate(30) scale(0.85)"/>
        <use xlink:href="#grain" transform="translate(-6 33) rotate(-28) scale(0.85)"/>
        <use xlink:href="#grain" transform="translate(6 40) rotate(32) scale(0.85)"/>
        <use xlink:href="#grain" transform="translate(-5 60) rotate(-30) scale(0.8)"/>
        <use xlink:href="#grain" transform="translate(5 66) rotate(28) scale(0.8)"/>
      </g>
      <g stroke="#c58f28" stroke-width="1" opacity="0.7">
        <path d="M0 -14 L -10 -40"/>
        <path d="M0 -14 L 2 -44"/>
        <path d="M0 -14 L 11 -36"/>
      </g>
    </g>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="200" height="280" fill="url(#bg)"/>
  <rect width="200" height="280" fill="url(#sun)"/>
  <g filter="url(#soft2)" opacity="0.6">
    <circle cx="52" cy="48" r="30" fill="url(#bok)"/>
    <circle cx="160" cy="88" r="26" fill="url(#bok)"/>
    <circle cx="96" cy="176" r="24" fill="url(#bok)"/>
    <circle cx="176" cy="220" r="20" fill="url(#bok)"/>
  </g>
  <g filter="url(#soft)" opacity="0.7">
    <circle cx="118" cy="40" r="8" fill="url(#bok)"/>
    <circle cx="24" cy="112" r="7" fill="url(#bok)"/>
    <circle cx="146" cy="146" r="9" fill="url(#bok)"/>
    <circle cx="64" cy="202" r="7" fill="url(#bok)"/>
    <circle cx="186" cy="168" r="6" fill="url(#bok)"/>
  </g>
  <use xlink:href="#stalk" transform="translate(18 0) rotate(-5 0 290)"/>
  <use xlink:href="#stalk" transform="translate(54 0) rotate(3 0 290)"/>
  <use xlink:href="#stalk" transform="translate(92 0) rotate(-2 0 290)"/>
  <use xlink:href="#stalk" transform="translate(128 0) rotate(4 0 290)"/>
  <use xlink:href="#stalk" transform="translate(166 0) rotate(-3 0 290)"/>
  <use xlink:href="#stalk" transform="translate(196 0) rotate(6 0 290)"/>
  <g fill="#fbe3a3" opacity="0.85">
    <circle cx="106" cy="62" r="1.6"/>
    <circle cx="38" cy="76" r="1.3"/>
    <circle cx="174" cy="60" r="1.4"/>
    <circle cx="78" cy="240" r="1.2"/>
  </g>
</svg>
