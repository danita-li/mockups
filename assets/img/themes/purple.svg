<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#bda4df"/>
      <stop offset="0.5" stop-color="#9576c2"/>
      <stop offset="1" stop-color="#5a4384"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="16%" r="90%">
      <stop offset="0" stop-color="#f0e4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="floret">
      <ellipse cx="0" cy="-6" rx="3.5" ry="6"/>
      <ellipse cx="0" cy="6" rx="3.5" ry="6"/>
      <ellipse cx="-6" cy="0" rx="3.5" ry="6" transform="rotate(90)"/>
      <ellipse cx="6" cy="0" rx="3.5" ry="6" transform="rotate(90)"/>
    </g>
    <g id="stalk">
      <path d="M0 0 C -5 -60 5 -130 0 -200" fill="none" stroke="#67823f" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M-1 -95 C -14 -104 -18 -114 -16 -124" fill="none" stroke="#74904a" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M1 -132 C 14 -140 18 -150 16 -160" fill="none" stroke="#67823f" stroke-width="2.2" stroke-linecap="round"/>
      <g fill="#c4a7ee">
        <use xlink:href="#floret" transform="translate(-6 -196) scale(0.9) rotate(-18)"/>
        <use xlink:href="#floret" transform="translate(7 -186) scale(0.95) rotate(12)"/>
        <use xlink:href="#floret" transform="translate(-7 -176) scale(1) rotate(20)"/>
        <use xlink:href="#floret" transform="translate(8 -166) scale(1.05) rotate(-10)"/>
        <use xlink:href="#floret" transform="translate(-6 -156) scale(1.1) rotate(15)"/>
        <use xlink:href="#floret" transform="translate(7 -145) scale(1.1) rotate(-14)"/>
        <use xlink:href="#floret" transform="translate(-5 -134) scale(1.15) rotate(8)"/>
        <use xlink:href="#floret" transform="translate(6 -123) scale(1.15) rotate(-18)"/>
      </g>
      <g fill="#a887d3">
        <use xlink:href="#floret" transform="translate(2 -192) scale(0.7) rotate(30)"/>
        <use xlink:href="#floret" transform="translate(-2 -168) scale(0.75) rotate(-25)"/>
        <use xlink:href="#floret" transform="translate(1 -140) scale(0.8) rotate(20)"/>
        <use xlink:href="#floret" transform="translate(-1 -118) scale(0.85) rotate(-12)"/>
      </g>
      <g fill="#dcc9f6" opacity="0.85">
        <use xlink:href="#floret" transform="translate(-9 -190) scale(0.55) rotate(10)"/>
        <use xlink:href="#floret" transform="translate(10 -158) scale(0.6) rotate(-20)"/>
        <use xlink:href="#floret" transform="translate(-8 -130) scale(0.6) rotate(26)"/>
      </g>
    </g>
    <g id="blurCluster">
      <use xlink:href="#floret" transform="translate(0 0) scale(1.4)"/>
      <use xlink:href="#floret" transform="translate(10 12) scale(1.1)"/>
      <use xlink:href="#floret" transform="translate(-9 14) scale(1)"/>
    </g>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="200" height="280" fill="url(#bg)"/>
  <rect width="200" height="280" fill="url(#glow)"/>
  <g filter="url(#soft)" opacity="0.4" fill="#c7aaf0">
    <use xlink:href="#blurCluster" transform="translate(24 54)"/>
    <use xlink:href="#blurCluster" transform="translate(150 40)"/>
    <use xlink:href="#blurCluster" transform="translate(96 96) scale(0.8)"/>
    <use xlink:href="#blurCluster" transform="translate(176 132) scale(0.9)"/>
    <use xlink:href="#blurCluster" transform="translate(46 132) scale(0.7)"/>
    <use xlink:href="#blurCluster" transform="translate(120 180) scale(0.85)"/>
  </g>
  <use xlink:href="#stalk" transform="translate(20 300) scale(1.08) rotate(-4)"/>
  <use xlink:href="#stalk" transform="translate(62 304) scale(0.96) rotate(3)"/>
  <use xlink:href="#stalk" transform="translate(104 300) scale(1.12) rotate(-2)"/>
  <use xlink:href="#stalk" transform="translate(146 305) scale(0.94) rotate(4)"/>
  <use xlink:href="#stalk" transform="translate(186 300) scale(1.04) rotate(-3)"/>
  <g filter="url(#soft)" opacity="0.35" fill="#e3d3fa">
    <circle cx="38" cy="72" r="14"/>
    <circle cx="168" cy="96" r="12"/>
    <circle cx="82" cy="210" r="16"/>
    <circle cx="132" cy="248" r="13"/>
  </g>
</svg>
